    <script>
        function actualizarHora() {
            // Obtener la fecha y hora actual
            const ahora = new Date();

            // Formatear la hora en HH:mm:ss
            const horas = ahora.getHours().toString().padStart(2, '0');
            const minutos = ahora.getMinutes().toString().padStart(2, '0');
            const segundos = ahora.getSeconds().toString().padStart(2, '0');
            const horaFormateada = `${horas}:${minutos}:${segundos}`;

            // Asignar la hora al elemento con el id "horaActual"
            document.getElementById('horaActual').textContent = horaFormateada;
        }

        // Ejecutar la función cada segundo (1000 ms)
        setInterval(actualizarHora, 1000);
    </script>

            const numSegmentos = mundiales.length;
            const radio = canvas.width / 2;

            let angulo = 0;
            let velocidad = 0;
            let animando = false;
            let mundialSeleccionado = "";

            function dibujarRuleta() {

                const anguloSegmento = (2 * Math.PI) / numSegmentos;

                for (let i = 0; i < numSegmentos; i++) {

                    const inicio = i * anguloSegmento;
                    const fin = inicio + anguloSegmento;

                    ctx.beginPath();
                    ctx.moveTo(radio, radio);
                    ctx.arc(radio, radio, radio - 5, inicio, fin);
                    ctx.closePath();

                    ctx.fillStyle = colores[i];
                    ctx.fill();

                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    const anguloTexto = inicio + anguloSegmento / 2;

                    ctx.save();

                    ctx.translate(
                        radio + Math.cos(anguloTexto) * (radio - 90),
                        radio + Math.sin(anguloTexto) * (radio - 90)
                    );

                    ctx.rotate(anguloTexto + Math.PI / 2);

                    ctx.fillStyle = "#fff";
                    ctx.font = "bold 18px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(mundiales[i], 0, 0);

                    ctx.restore();
                }
            }

            function dibujarFlecha() {

                ctx.save();

                ctx.translate(radio, radio);

                ctx.beginPath();
                ctx.moveTo(0, -radio + 5);
                ctx.lineTo(-20, -radio + 35);
                ctx.lineTo(20, -radio + 35);
                ctx.closePath();

                ctx.fillStyle = "red";
                ctx.fill();

                ctx.restore();
            }

            function dibujar() {

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.save();
                ctx.translate(radio, radio);
                ctx.rotate(angulo);
                ctx.translate(-radio, -radio);

                dibujarRuleta();

                ctx.restore();

                dibujarFlecha();
            }

            function girarRuleta() {

                if (animando) return;

                animando = true;

                // Reiniciar botones
                document.querySelectorAll(".btn-numero").forEach(btn => {
                    btn.disabled = false;
                    btn.style.background = "#004aad";
                });

                document.getElementById("panelNumeros").style.display = "none";

                velocidad = Math.random() * 0.4 + 0.45;

                function animar() {

                    velocidad *= 0.992;
                    angulo += velocidad;

                    dibujar();

                    if (velocidad > 0.002) {

                        requestAnimationFrame(animar);

                    } else {

                        let anguloNormalizado = angulo % (2 * Math.PI);

                        const anguloSegmento = (2 * Math.PI) / numSegmentos;

                        let indice = Math.floor(
                            (numSegmentos - (anguloNormalizado / anguloSegmento))
                        ) % numSegmentos;

                        if (indice < 0) indice += numSegmentos;

                        mundialSeleccionado = mundiales[indice];

                        // Mostrar año seleccionado
                        numeroDisplay.textContent = mundialSeleccionado;

                        // Mostrar mensaje
                        preguntaDisplay.innerHTML =
                            "<strong>Seleccione un número del 1 al 9</strong>";

                        // Mostrar título
                        document.getElementById("tituloMundial").innerHTML =
                            "⚽ Mundial " + mundialSeleccionado;

                        // Mostrar botones
                        document.getElementById("panelNumeros").style.display = "block";

                        animando = false;
                    }
                }

                requestAnimationFrame(animar);
            }

            girarBtn.addEventListener("click", girarRuleta);

            document.querySelectorAll(".btn-numero").forEach(btn => {

                btn.addEventListener("click", function () {

                    if (!mundialSeleccionado) {

                        Swal.fire({
                            icon: "warning",
                            title: "Primero gira la ruleta"
                        });

                        return;
                    }

                    const numero = this.textContent;

                    const pregunta =
                        preguntasMundiales[mundialSeleccionado][numero];

                    const respuestaData =
                        respuestasMundiales[mundialSeleccionado]?.[numero];

                    Swal.fire({
                        title: "⚽ Mundial " + mundialSeleccionado,
                        html: `
                <h3>Pregunta ${numero}</h3>
                <p>${pregunta}</p>
            `,
                        icon: "question",
                        confirmButtonText: "Ver respuesta"
                    }).then((result) => {

                        if (result.isConfirmed) {

                            if (respuestaData) {

                                Swal.fire({
                                    title: "Respuesta",
                                    imageUrl: respuestaData.imagen,
                                    imageWidth: 350,
                                    imageAlt: "Respuesta",
                                    html: `
                            <p style="font-size:16px;">
                                ${respuestaData.respuesta}
                            </p>
                        `,
                                    confirmButtonText: "Continuar"
                                });

                            } else {

                                Swal.fire({
                                    icon: "info",
                                    title: "Respuesta pendiente",
                                    text: "No se ha agregado la respuesta para esta pregunta."
                                });

                            }

                        }

                    });

                    this.disabled = true;
                    this.style.background = "#999";

                });

            });
            dibujar();

        });
    </script>

</body>

</html>
