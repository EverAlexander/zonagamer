    <script>
        function actualizarHora() {
            // Obtener la fecha y hora actual
            const ahora = new Date();

            // Formatear la hora en HH:mm:ss
            const horas = ahora.getHours().toString().padStart(2, '0');
            const minutos = ahora.getMinutes().toString().padStart(2, '0');
            const segundos = ahora.getSeconds().toString().padStart(2, '0');
            const horaFormateada = `${horas}:${minutos}:${segundos}`;

            // Asignar la hora al elemento con el id "horaActual"
            document.getElementById('horaActual').textContent = horaFormateada;
        }

        // Ejecutar la función cada segundo (1000 ms)
        setInterval(actualizarHora, 1000);
    </script>

    <script>
        const player = document.getElementById("player");
        const obstacle = document.getElementById("obstacle");
        const game = document.getElementById("game");
        const startBtn = document.getElementById("startBtn");
        const historyList = document.getElementById("history");
        const clearBtn = document.getElementById("clearBtn");

        let score = 0;
        let isGameOver = false;
        let speed = 2;
        let gameStarted = false;

        // 🔊 SONIDO
        const jumpSound = new Audio("../audio/salto.mp3");

        // 📊 HISTORIAL
        let history = JSON.parse(localStorage.getItem("scores")) || [];
        renderHistory();

        function renderHistory() {
            historyList.innerHTML = "";
            history.forEach(s => {
                let li = document.createElement("li");
                li.className = "list-group-item";
                li.textContent = "⏱ " + s + " seg";
                historyList.appendChild(li);
            });
        }

        // 🗑 LIMPIAR
        clearBtn.addEventListener("click", () => {
            Swal.fire({
                title: "¿Eliminar historial?",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Sí"
            }).then((r) => {
                if (r.isConfirmed) {
                    localStorage.removeItem("scores");
                    history = [];
                    renderHistory();
                }
            });
        });

        // ▶ INICIAR
        startBtn.addEventListener("click", () => {
            game.style.display = "block";
            startBtn.style.display = "none";
            gameStarted = true;
            startGame();
        });

        // 🦘 SALTO
        document.addEventListener("keydown", (e) => {
            if (!gameStarted) return;

            if (e.code === "Space") {
                if (!player.classList.contains("jump")) {

                    jumpSound.currentTime = 0;
                    jumpSound.play();

                    player.classList.add("jump");

                    setTimeout(() => {
                        player.classList.remove("jump");
                    }, 500);
                }
            }
        });

        // 🚧 MOVIMIENTO
        function moveObstacle() {
            obstacle.style.animation = `move ${speed}s linear`;

            setTimeout(() => {
                obstacle.style.animation = "none";
                obstacle.offsetHeight;
                if (!isGameOver) moveObstacle();
            }, speed * 1000);
        }

        // ⚡ DIFICULTAD
        function increaseDifficulty() {
            setInterval(() => {
                if (!isGameOver && speed > 0.8) {
                    speed -= 0.1;
                }
            }, 5000);
        }

        // 💥 COLISIÓN (CORREGIDA)
        function checkCollision() {
            const playerRect = player.getBoundingClientRect();
            const obstacleRect = obstacle.getBoundingClientRect();

            const padding = 10;

            const isColliding =
                playerRect.right - padding > obstacleRect.left &&
                playerRect.left + padding < obstacleRect.right &&
                playerRect.bottom - padding > obstacleRect.top &&
                playerRect.top + padding < obstacleRect.bottom;

            if (isColliding && !isGameOver) {
                isGameOver = true;

                history.push(score);
                localStorage.setItem("scores", JSON.stringify(history));

                Swal.fire({
                    icon: "error",
                    title: "💀 Game Over",
                    text: "Tiempo: " + score
                }).then(() => location.reload());
            }
        }

        // ⏱ SCORE
        function startScore() {
            setInterval(() => {
                if (!isGameOver) {
                    score++;
                    document.getElementById("score").innerText = "Tiempo: " + score;
                }
            }, 1000);
        }

        // 🚀 START
        function startGame() {
            moveObstacle();
            increaseDifficulty();
            startScore();
            setInterval(checkCollision, 50);
        }
    </script>
