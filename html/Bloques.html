    src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js">

<script>


    // ==========================================
    // ELEMENTOS
    // ==========================================

    const player =
        document.getElementById(
            "player"
        );


    const obstacle =
        document.getElementById(
            "obstacle"
        );


    const game =
        document.getElementById(
            "game"
        );


    const startBtn =
        document.getElementById(
            "startBtn"
        );


    const jumpBtn =
        document.getElementById(
            "jumpBtn"
        );


    const historyList =
        document.getElementById(
            "history"
        );


    const clearBtn =
        document.getElementById(
            "clearBtn"
        );


    const scoreElement =
        document.getElementById(
            "score"
        );


    const mensajeJuego =
        document.getElementById(
            "mensajeJuego"
        );


    // ==========================================
    // VARIABLES
    // ==========================================

    let score = 0;

    let isGameOver = false;

    let speed = 2;

    let gameStarted = false;

    let gameLoopStarted = false;


    // ==========================================
    // SONIDO
    // ==========================================

    const jumpSound =
        new Audio(
            "../audio/salto.mp3"
        );


    // ==========================================
    // HISTORIAL
    // ==========================================

    let history =
        JSON.parse(
            localStorage.getItem(
                "scores"
            )
        ) || [];


    // Mostrar historial

    renderHistory();


    function renderHistory() {

        historyList.innerHTML = "";


        history.forEach(
            s => {

                let li =
                    document.createElement(
                        "li"
                    );


                li.className =
                    "list-group-item";


                li.textContent =
                    "⏱ " +
                    s +
                    " seg";


                historyList.appendChild(
                    li
                );

            }
        );

    }


    // ==========================================
    // LIMPIAR HISTORIAL
    // ==========================================

    clearBtn.addEventListener(
        "click",
        () => {


            Swal.fire({

                title:
                    "¿Eliminar historial?",

                icon:
                    "warning",

                showCancelButton:
                    true,

                confirmButtonText:
                    "Sí",

                cancelButtonText:
                    "Cancelar"

            }).then(
                (r) => {


                    if (
                        r.isConfirmed
                    ) {


                        localStorage.removeItem(
                            "scores"
                        );


                        history = [];


                        renderHistory();

                    }

                }
            );

        }
    );


    // ==========================================
    // INICIAR JUEGO
    // ==========================================

    startBtn.addEventListener(
        "click",
        iniciarJuego
    );


    // También funciona con pantalla táctil

    startBtn.addEventListener(
        "pointerdown",
        (e) => {

            e.preventDefault();

        }
    );


    function iniciarJuego() {

        // Evitar iniciar varias veces

        if (
            gameStarted
        ) {

            return;

        }


        game.style.display =
            "block";


        startBtn.style.display =
            "none";


        gameStarted =
            true;


        isGameOver =
            false;


        score =
            0;


        speed =
            2;


        scoreElement.innerText =
            "Tiempo: 0";


        mensajeJuego.textContent =
            "🦘 ¡Salta para evitar los obstáculos!";


        // Iniciar juego

        startGame();

    }


    // ==========================================
    // FUNCIÓN DE SALTO
    // ==========================================

    function saltar() {


        // Si el juego no ha comenzado

        if (
            !gameStarted
        ) {

            return;

        }


        // Si terminó

        if (
            isGameOver
        ) {

            return;

        }


        // Evitar doble salto

        if (
            player.classList.contains(
                "jump"
            )
        ) {

            return;

        }


        // Reproducir sonido

        jumpSound.currentTime =
            0;


        jumpSound.play().catch(
            (error) => {

                console.log(
                    "No se pudo reproducir el sonido:",
                    error
                );

            }
        );


        // Agregar salto

        player.classList.add(
            "jump"
        );


        // Quitar salto

        setTimeout(
            () => {

                player.classList.remove(
                    "jump"
                );

            },
            500
        );

    }


    // ==========================================
    // TECLADO - ESPACIO
    // ==========================================

    document.addEventListener(
        "keydown",
        (e) => {


            // Detectar espacio

            if (
                e.code === "Space" ||
                e.key === " "
            ) {


                // Evitar desplazamiento
                // de la página

                e.preventDefault();


                saltar();

            }

        }
    );


    // ==========================================
    // PANTALLA TÁCTIL
    // ==========================================

    game.addEventListener(
        "pointerdown",
        (e) => {


            // Evitar acciones
            // del navegador

            e.preventDefault();


            saltar();

        }
    );


    // ==========================================
    // BOTÓN SALTAR
    // ==========================================

    jumpBtn.addEventListener(
        "pointerdown",
        (e) => {


            // Evitar comportamiento
            // predeterminado

            e.preventDefault();


            // Evitar que el evento
            // llegue al juego

            e.stopPropagation();


            // Saltar

            saltar();

        }
    );


    // Compatibilidad adicional
    // para dispositivos táctiles

    jumpBtn.addEventListener(
        "touchstart",
        (e) => {


            e.preventDefault();

            e.stopPropagation();

            saltar();

        },
        {
            passive: false
        }
    );


    // ==========================================
    // MOVIMIENTO DEL OBSTÁCULO
    // ==========================================

    function moveObstacle() {


        // Si el juego terminó

        if (
            isGameOver
        ) {

            return;

        }


        // Animación

        obstacle.style.animation =
            `move ${speed}s linear`;


        // Esperar duración

        setTimeout(
            () => {


                // Detener animación

                obstacle.style.animation =
                    "none";


                // Forzar actualización

                obstacle.offsetHeight;


                // Si todavía juega

                if (
                    !isGameOver
                ) {


                    // Aumentar velocidad

                    if (
                        speed > 0.7
                    ) {

                        speed -=
                            0.05;

                    }


                    // Volver a mover

                    moveObstacle();

                }

            },
            speed * 1000
        );

    }


    // ==========================================
    // DETECTAR COLISIÓN
    // ==========================================

    function checkCollision() {


        // Si no inició

        if (
            !gameStarted
        ) {

            return;

        }


        // Si terminó

        if (
            isGameOver
        ) {

            return;

        }


        const playerRect =
            player.getBoundingClientRect();


        const obstacleRect =
            obstacle.getBoundingClientRect();


        // Margen de seguridad

        const padding =
            10;


        const isColliding =

            playerRect.right -
                padding >
            obstacleRect.left

            &&

            playerRect.left +
                padding <
            obstacleRect.right

            &&

            playerRect.bottom -
                padding >
            obstacleRect.top

            &&

            playerRect.top +
                padding <
            obstacleRect.bottom;


        // Si chocó

        if (
            isColliding &&
            !isGameOver
        ) {


            // Game Over

            isGameOver =
                true;


            // Guardar puntuación

            history.push(
                score
            );


            localStorage.setItem(
                "scores",
                JSON.stringify(
                    history
                )
            );


            // Detener animación

            obstacle.style.animation =
                "none";


            // Mostrar mensaje

            mensajeJuego.textContent =
                "💀 ¡Game Over!";


            // Mostrar alerta

            Swal.fire({

                icon:
                    "error",

                title:
                    "💀 Game Over",

                text:
                    "Tiempo: " +
                    score,

                confirmButtonText:
                    "Jugar nuevamente"

            }).then(
                () => {

                    location.reload();

                }
            );

        }

    }


    // ==========================================
    // SCORE
    // ==========================================

    function startScore() {


        setInterval(
            () => {


                if (
                    !isGameOver &&
                    gameStarted
                ) {


                    score++;


                    scoreElement.innerText =
                        "Tiempo: " +
                        score;

                }

            },
            1000
        );

    }


    // ==========================================
    // INICIAR MOTOR DEL JUEGO
    // ==========================================

    function startGame() {


        // Evitar crear varios motores

        if (
            gameLoopStarted
        ) {

            return;

        }


        gameLoopStarted =
            true;


        // Mover obstáculo

        moveObstacle();


        // Iniciar contador

        startScore();


        // Revisar colisiones

        setInterval(
            checkCollision,
            50
        );

    }


</script>
