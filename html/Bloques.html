<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zona Gamer</title>

    <!-- Bootstrap -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">

    <!-- SweetAlert -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        body {
            background: #87CEEB;
        }

        /* 🎮 JUEGO */
        #game {
            position: relative;
            width: 100%;
            height: 300px;
            border: 3px solid black;
            overflow: hidden;
            background: linear-gradient(#5c94fc, #cceeff);
            display: none;
        }

        #player {
            position: absolute;
            bottom: 0;
            left: 50px;
            width: 50px;
        }

        .jump {
            animation: jump 0.5s ease;
        }

        @keyframes jump {
            0% { bottom: 0; }
            50% { bottom: 120px; }
            100% { bottom: 0; }
        }

        #obstacle {
            position: absolute;
            bottom: 0;
            right: -50px;
            width: 50px;
        }

        @keyframes move {
            from { right: -50px; }
            to { right: 100%; }
        }
    </style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">🎮 Zona Gamer</span>
    </div>
</nav>

<div class="container mt-4 text-center">

    <h3>🏃‍♂️ Salto infinito</h3>
    <p>Presiona ESPACIO para saltar</p>

    <button id="startBtn" class="btn btn-success mb-2">▶ Iniciar</button>

    <div id="score">Tiempo: 0</div>

    <h5 class="mt-3">🏆 Historial</h5>
    <ul id="history" class="list-unstyled"></ul>

    <button id="clearBtn" class="btn btn-danger btn-sm mt-2">
        🗑 Limpiar historial
    </button>

    <div id="game" class="mt-3">
        <img id="player" src="imagenes/yosshi.png">
        <img id="obstacle" src="imagenes/bloque.png">
    </div>

</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
const player = document.getElementById("player");
const obstacle = document.getElementById("obstacle");
const game = document.getElementById("game");
const startBtn = document.getElementById("startBtn");
const historyList = document.getElementById("history");
const clearBtn = document.getElementById("clearBtn");

let score = 0;
let isGameOver = false;
let speed = 2;
let gameStarted = false;

// 🔊 sonido
const jumpSound = new Audio("audio/salto.mp3");

// historial
let history = JSON.parse(localStorage.getItem("scores")) || [];
renderHistory();

function renderHistory() {
    historyList.innerHTML = "";
    history.forEach(s => {
        let li = document.createElement("li");
        li.textContent = s;
        historyList.appendChild(li);
    });
}

// limpiar historial
clearBtn.addEventListener("click", () => {
    if (confirm("¿Seguro que quieres borrar el historial?")) {
        localStorage.removeItem("scores");
        history = [];
        renderHistory();
    }
});

// iniciar
startBtn.addEventListener("click", () => {
    game.style.display = "block";
    startBtn.style.display = "none";
    gameStarted = true;
    startGame();
});

// salto
document.addEventListener("keydown", function (e) {
    if (!gameStarted) return;

    if (e.code === "Space") {
        if (!player.classList.contains("jump")) {

            jumpSound.currentTime = 0;
            jumpSound.play();

            player.classList.add("jump");

            setTimeout(() => {
                player.classList.remove("jump");
            }, 500);
        }
    }
});

// movimiento
function moveObstacle() {
    obstacle.style.animation = `move ${speed}s linear`;

    setTimeout(() => {
        obstacle.style.animation = "none";
        obstacle.offsetHeight;
        if (!isGameOver) moveObstacle();
    }, speed * 1000);
}

// dificultad
function increaseDifficulty() {
    return setInterval(() => {
        if (!isGameOver && speed > 0.8) {
            speed -= 0.1;
        }
    }, 5000);
}

// colisión
function checkCollision() {
    const playerRect = player.getBoundingClientRect();
    const obstacleRect = obstacle.getBoundingClientRect();

    const isColliding =
        playerRect.right > obstacleRect.left &&
        playerRect.left < obstacleRect.right &&
        playerRect.bottom > obstacleRect.top;

    if (isColliding && !isGameOver) {
        isGameOver = true;

        history.push(score);
        localStorage.setItem("scores", JSON.stringify(history));

        Swal.fire({
            icon: "error",
            title: "💀 Game Over",
            text: "Tiempo: " + score
        }).then(() => location.reload());
    }
}

// puntos
function startScore() {
    return setInterval(() => {
        if (!isGameOver) {
            score++;
            document.getElementById("score").innerText = "Tiempo: " + score;
        }
    }, 1000);
}

// iniciar todo
function startGame() {
    moveObstacle();
    increaseDifficulty();
    startScore();
    setInterval(checkCollision, 50);
}
</script>

</body>
</html>
