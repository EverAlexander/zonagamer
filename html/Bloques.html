<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Juego Runner</title>

<link href="https://maxcdn.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body {
    background: #f5f5f5;
}

/* 🎮 JUEGO */
#game {
    position: relative;
    width: 100%;
    height: 300px;
    border: 3px solid black;
    overflow: hidden;
    background: linear-gradient(#5c94fc, #cceeff);
    display: none;
}

#player {
    position: absolute;
    bottom: 0;
    left: 50px;
    width: 60px;
}

#obstacle {
    position: absolute;
    bottom: 0;
    right: -60px;
    width: 60px;
}

.jump {
    animation: jump 0.5s ease;
}

@keyframes jump {
    0% { bottom: 0; }
    50% { bottom: 120px; }
    100% { bottom: 0; }
}

@keyframes move {
    from { right: -60px; }
    to { right: 100%; }
}

/* 📊 HISTORIAL */
#history {
    max-height: 220px;
    overflow-y: auto;
}

</style>
</head>

<body>

<div class="container mt-5">
    <div class="row justify-content-center">

        <!-- 🎮 JUEGO -->
        <div class="col-md-6 text-center">
            <button id="startBtn" class="btn btn-success mb-2">▶ Iniciar</button>

            <div id="score">Tiempo: 0</div>

            <div id="game" class="mt-3">
                <img id="player" src="../imagenes/peach002.png">
                <img id="obstacle" src="../imagenes/goomba.png">
            </div>
        </div>

        <!-- 📊 PANEL -->
        <div class="col-md-4">
            <h5>🏆 Historial</h5>
            <ul id="history" class="list-group mb-2"></ul>

            <button id="clearBtn" class="btn btn-danger btn-sm">
                🗑 Limpiar historial
            </button>
        </div>

    </div>
</div>

<script>
const player = document.getElementById("player");
const obstacle = document.getElementById("obstacle");
const game = document.getElementById("game");
const startBtn = document.getElementById("startBtn");
const historyList = document.getElementById("history");
const clearBtn = document.getElementById("clearBtn");

let score = 0;
let isGameOver = false;
let speed = 2;
let gameStarted = false;

// 🔊 SONIDO
const jumpSound = new Audio("../audio/salto.mp3");

// 📊 HISTORIAL
let history = JSON.parse(localStorage.getItem("scores")) || [];
renderHistory();

function renderHistory() {
    historyList.innerHTML = "";
    history.forEach(s => {
        let li = document.createElement("li");
        li.className = "list-group-item";
        li.textContent = "⏱ " + s + " seg";
        historyList.appendChild(li);
    });
}

// 🗑 LIMPIAR
clearBtn.addEventListener("click", () => {
    Swal.fire({
        title: "¿Eliminar historial?",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Sí"
    }).then((r) => {
        if (r.isConfirmed) {
            localStorage.removeItem("scores");
            history = [];
            renderHistory();
        }
    });
});

// ▶ INICIAR
startBtn.addEventListener("click", () => {
    game.style.display = "block";
    startBtn.style.display = "none";
    gameStarted = true;
    startGame();
});

// 🦘 SALTO
document.addEventListener("keydown", (e) => {
    if (!gameStarted) return;

    if (e.code === "Space") {
        if (!player.classList.contains("jump")) {

            jumpSound.currentTime = 0;
            jumpSound.play();

            player.classList.add("jump");

            setTimeout(() => {
                player.classList.remove("jump");
            }, 500);
        }
    }
});

// 🚧 MOVIMIENTO
function moveObstacle() {
    obstacle.style.animation = `move ${speed}s linear`;

    setTimeout(() => {
        obstacle.style.animation = "none";
        obstacle.offsetHeight;
        if (!isGameOver) moveObstacle();
    }, speed * 1000);
}

// ⚡ DIFICULTAD
function increaseDifficulty() {
    setInterval(() => {
        if (!isGameOver && speed > 0.8) {
            speed -= 0.1;
        }
    }, 5000);
}

// 💥 COLISIÓN (CORREGIDA)
function checkCollision() {
    const playerRect = player.getBoundingClientRect();
    const obstacleRect = obstacle.getBoundingClientRect();

    const padding = 10;

    const isColliding =
        playerRect.right - padding > obstacleRect.left &&
        playerRect.left + padding < obstacleRect.right &&
        playerRect.bottom - padding > obstacleRect.top &&
        playerRect.top + padding < obstacleRect.bottom;

    if (isColliding && !isGameOver) {
        isGameOver = true;

        history.push(score);
        localStorage.setItem("scores", JSON.stringify(history));

        Swal.fire({
            icon: "error",
            title: "💀 Game Over",
            text: "Tiempo: " + score
        }).then(() => location.reload());
    }
}

// ⏱ SCORE
function startScore() {
    setInterval(() => {
        if (!isGameOver) {
            score++;
            document.getElementById("score").innerText = "Tiempo: " + score;
        }
    }, 1000);
}

// 🚀 START
function startGame() {
    moveObstacle();
    increaseDifficulty();
    startScore();
    setInterval(checkCollision, 50);
}
</script>

</body>
</html>
