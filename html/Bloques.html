<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zona Gamer</title>

<link href="https://maxcdn.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

<style>
body {
    background: #f8f9fc;
}

/* 🎮 BOTÓN */
#startBtn {
    font-size: 20px;
}

/* 🌑 OVERLAY */
#gameOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

/* 🎮 CONTENEDOR */
#gameContainer {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    position: relative;
}

/* ❌ BOTÓN SALIR */
#closeBtn {
    position: absolute;
    top: 10px;
    right: 10px;
}

/* 🎮 JUEGO */
#game {
    position: relative;
    width: 500px;
    height: 200px;
    border: 3px solid black;
    overflow: hidden;
    background: linear-gradient(#5c94fc, #cceeff);
    margin: 10px auto;
}

#player {
    position: absolute;
    bottom: 0;
    left: 50px;
    width: 50px;
}

.jump {
    animation: jump 0.5s ease;
}

@keyframes jump {
    0% { bottom: 0; }
    50% { bottom: 120px; }
    100% { bottom: 0; }
}

#obstacle {
    position: absolute;
    bottom: 0;
    right: -50px;
    width: 50px;
}

@keyframes move {
    from { right: -50px; }
    to { right: 100%; }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">🎮 Zona Gamer</span>
    </div>
</nav>

<div class="container text-center mt-5">

    <h2>Bienvenido a la Zona Gamer</h2>

    <button id="startBtn" class="btn btn-success mt-3">
        🎮 Jugar Salto Infinito
    </button>

</div>

<!-- 🎮 OVERLAY -->
<div id="gameOverlay">

    <div id="gameContainer">

        <button id="closeBtn" class="btn btn-danger btn-sm">✖</button>

        <h4>🏃‍♂️ Salto infinito</h4>
        <p>Presiona ESPACIO para saltar</p>

        <div id="score">Tiempo: 0</div>

        <div id="game">
            <img id="player" src="imagenes/yosshi.png">
            <img id="obstacle" src="imagenes/bloque.png">
        </div>

        <h6>🏆 Historial</h6>
        <ul id="history" class="list-unstyled"></ul>

        <button id="clearBtn" class="btn btn-warning btn-sm">
            🗑 Limpiar
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
const player = document.getElementById("player");
const obstacle = document.getElementById("obstacle");
const startBtn = document.getElementById("startBtn");
const gameOverlay = document.getElementById("gameOverlay");
const closeBtn = document.getElementById("closeBtn");
const historyList = document.getElementById("history");
const clearBtn = document.getElementById("clearBtn");

let score = 0;
let isGameOver = false;
let speed = 2;
let gameStarted = false;

const jumpSound = new Audio("audio/salto.mp3");

// HISTORIAL
let history = JSON.parse(localStorage.getItem("scores")) || [];
renderHistory();

function renderHistory() {
    historyList.innerHTML = "";
    history.forEach(s => {
        let li = document.createElement("li");
        li.textContent = s;
        historyList.appendChild(li);
    });
}

// LIMPIAR
clearBtn.addEventListener("click", () => {
    Swal.fire({
        title: "¿Eliminar historial?",
        icon: "warning",
        showCancelButton: true
    }).then((res) => {
        if (res.isConfirmed) {
            localStorage.removeItem("scores");
            history = [];
            renderHistory();
        }
    });
});

// INICIAR
startBtn.addEventListener("click", () => {
    gameOverlay.style.display = "flex";
    gameStarted = true;
    startGame();
});

// SALIR
closeBtn.addEventListener("click", () => {
    location.reload();
});

// SALTO
document.addEventListener("keydown", (e) => {
    if (!gameStarted) return;

    if (e.code === "Space") {
        if (!player.classList.contains("jump")) {
            jumpSound.currentTime = 0;
            jumpSound.play();

            player.classList.add("jump");

            setTimeout(() => {
                player.classList.remove("jump");
            }, 500);
        }
    }
});

// MOVIMIENTO
function moveObstacle() {
    obstacle.style.animation = `move ${speed}s linear`;

    setTimeout(() => {
        obstacle.style.animation = "none";
        obstacle.offsetHeight;
        if (!isGameOver) moveObstacle();
    }, speed * 1000);
}

// DIFICULTAD
function increaseDifficulty() {
    setInterval(() => {
        if (!isGameOver && speed > 0.8) {
            speed -= 0.1;
        }
    }, 5000);
}

// COLISIÓN
function checkCollision() {
    const p = player.getBoundingClientRect();
    const o = obstacle.getBoundingClientRect();

    if (
        p.right > o.left &&
        p.left < o.right &&
        p.bottom > o.top
    ) {
        isGameOver = true;

        history.push(score);
        localStorage.setItem("scores", JSON.stringify(history));

        Swal.fire("💀 Game Over", "Tiempo: " + score, "error")
            .then(() => location.reload());
    }
}

// SCORE
function startScore() {
    setInterval(() => {
        if (!isGameOver) {
            score++;
            document.getElementById("score").innerText = "Tiempo: " + score;
        }
    }, 1000);
}

// START
function startGame() {
    moveObstacle();
    increaseDifficulty();
    startScore();
    setInterval(checkCollision, 50);
}
</script>

</body>
</html>
