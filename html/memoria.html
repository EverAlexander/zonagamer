        #tablero {
            display: grid;
            grid-template-columns: repeat(8, 100px);
            grid-auto-rows: 120px;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        .carta {
            width: 100px;
            height: 120px;
            border-radius: 10px;
            border: 2px solid #343a40;
            background: #343a40;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .carta:hover {
            transform: scale(1.05);
        }

        .carta img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #fff;
            padding: 5px;
        }

        .carta.acertada {
            border: 3px solid #28a745;
            cursor: default;
        }
    </style>

    <script>
        function actualizarHora() {

            const ahora = new Date();

            const horas = ahora.getHours().toString().padStart(2, '0');
            const minutos = ahora.getMinutes().toString().padStart(2, '0');
            const segundos = ahora.getSeconds().toString().padStart(2, '0');

            const horaFormateada = `${horas}:${minutos}:${segundos}`;

            document.getElementById('horaActual').textContent = horaFormateada;
        }

        setInterval(actualizarHora, 1000);

        actualizarHora();
    </script>

    <script>

        // ==========================================
        // ELEMENTOS DEL DOM
        // ==========================================

        const tablero = document.getElementById("tablero");

        const contador = document.getElementById("contador");

        const btnReiniciar = document.getElementById("reiniciar");

        const btnBarajear = document.getElementById("btnBarajear");

        const musicaJuego = document.getElementById("musicaJuego");


        // ==========================================
        // VARIABLES DEL JUEGO
        // ==========================================

        let cartas = [];

        let seleccionadas = [];

        let parejasEncontradas = 0;

        let tiempoMemoria = 15;

        let intervalo = null;

        let bloqueo = false;

        // NUEVO:
        // El jugador tiene 3 intentos
        let intentosRestantes = 3;


        // ==========================================
        // IMAGEN DEL DORSO
        // ==========================================

        const dorso = "../imagenes/busqueda.png";


        // ==========================================
        // IMÁGENES DE LAS CARTAS
        // ==========================================

        const imagenes = [

            "../imagenes/mario.jpeg",

            "../imagenes/estrella.jpg",

            "../imagenes/hongo.png",

            "../imagenes/flor.jpg",

            "../imagenes/luigi.jpg",

            "../imagenes/caparazonazul.png",

            "../imagenes/peach.png",

            "../imagenes/toade.png",

            "../imagenes/pregu.png",

            "../imagenes/monedd.jpg",

            "../imagenes/rosalina.png",

            "../imagenes/pirana.jpg",

            "../imagenes/deysi.png",

            "../imagenes/yoshi.png",

            "../imagenes/bom.png",

            "../imagenes/bala.jpeg"

        ];


        // ==========================================
        // INICIAR MÚSICA
        // ==========================================

        function iniciarMusica() {

            musicaJuego.currentTime = 0;

            musicaJuego.play().catch(err => {

                console.log(
                    "Autoplay bloqueado:",
                    err
                );

            });

        }


        // ==========================================
        // DETENER MÚSICA
        // ==========================================

        function detenerMusica() {

            musicaJuego.pause();

            musicaJuego.currentTime = 0;

        }


        // ==========================================
        // GENERAR CARTAS
        // ==========================================

        function generarCartas() {

            clearInterval(intervalo);

            tablero.innerHTML = "";

            cartas = [];

            seleccionadas = [];

            parejasEncontradas = 0;

            bloqueo = false;

            // Reiniciar los 3 intentos
            intentosRestantes = 3;

            btnReiniciar.style.display = "none";

            detenerMusica();


            // Crear las parejas
            let valores = [
                ...imagenes,
                ...imagenes
            ];


            // Barajar cartas
            valores.sort(
                () => Math.random() - 0.5
            );


            // Crear cada carta
            valores.forEach(
                (valor, index) => {

                    const div =
                        document.createElement("div");

                    div.className = "carta";

                    div.dataset.valor = valor;


                    const img =
                        document.createElement("img");

                    img.src = valor;

                    img.alt =
                        "carta " + (index + 1);


                    div.appendChild(img);


                    div.addEventListener(
                        "click",
                        () => seleccionarCarta(div)
                    );


                    tablero.appendChild(div);

                    cartas.push(div);

                }
            );

        }


        // ==========================================
        // CONTADOR INICIAL
        // ==========================================

        function iniciarContador() {

            clearInterval(intervalo);

            tiempoMemoria = 10;


            contador.textContent =
                `Memoriza las cartas, tienes ${tiempoMemoria}s...`;


            intervalo = setInterval(
                () => {

                    tiempoMemoria--;


                    if (tiempoMemoria > 0) {

                        contador.textContent =
                            `Memoriza las cartas, tienes ${tiempoMemoria}s...`;

                    } else {

                        clearInterval(intervalo);


                        contador.textContent =
                            `¡Encuentra las parejas! | Intentos: ${intentosRestantes}`;


                        ocultarCartas();


                        // Iniciar música
                        iniciarMusica();

                    }

                },
                1000
            );

        }


        // ==========================================
        // OCULTAR TODAS LAS CARTAS
        // ==========================================

        function ocultarCartas() {

            cartas.forEach(
                c => {

                    c.querySelector("img").src =
                        dorso;

                    c.classList.add("oculta");

                    c.classList.remove("acertada");

                }
            );


            parejasEncontradas = 0;

        }


        // ==========================================
        // SELECCIONAR CARTA
        // ==========================================

        function seleccionarCarta(carta) {

            // Si el juego está bloqueado
            if (bloqueo) {
                return;
            }


            // Si la carta está visible
            // no se puede seleccionar
            if (!carta.classList.contains("oculta")) {
                return;
            }


            // Evitar seleccionar dos veces
            // la misma carta
            if (seleccionadas.includes(carta)) {
                return;
            }


            // Mostrar carta
            carta.querySelector("img").src =
                carta.dataset.valor;


            carta.classList.remove("oculta");


            // Agregar a seleccionadas
            seleccionadas.push(carta);


            // Si ya seleccionó 2
            if (seleccionadas.length === 2) {

                bloqueo = true;


                setTimeout(
                    verificarPareja,
                    700
                );

            }

        }


        // ==========================================
        // VERIFICAR PAREJA
        // ==========================================

        function verificarPareja() {

            const [c1, c2] =
                seleccionadas;


            // Validación
            if (!c1 || !c2) {

                seleccionadas = [];

                bloqueo = false;

                return;

            }


            // ==========================================
            // PAREJA CORRECTA
            // ==========================================

            if (
                c1.dataset.valor ===
                c2.dataset.valor
            ) {


                // Marcar cartas como acertadas
                c1.classList.add("acertada");

                c2.classList.add("acertada");


                // Las cartas permanecen visibles
                c1.classList.remove("oculta");

                c2.classList.remove("oculta");


                // Incrementar parejas encontradas
                parejasEncontradas++;


                // Actualizar contador
                contador.textContent =
                    `Parejas encontradas: ${parejasEncontradas} / 16 | Intentos restantes: ${intentosRestantes}`;


                // ==========================================
                // GANÓ EL JUEGO
                // ==========================================

                if (
                    parejasEncontradas === 16
                ) {


                    contador.textContent =
                        "🎉 ¡Completado!";


                    detenerMusica();


                    Swal.fire({

                        title:
                            "🎉 ¡Felicidades!",

                        text:
                            "Has encontrado todas las parejas",

                        icon:
                            "success",

                        confirmButtonText:
                            "Aceptar",

                        imageUrl:
                            "../imagenes/encu.png",

                        imageWidth:
                            120,

                        imageHeight:
                            120,

                        imageAlt:
                            "Trofeo"

                    });


                    btnReiniciar.style.display =
                        "inline-block";


                    btnBarajear.style.display =
                        "inline-block";

                }


                // Limpiar selección
                seleccionadas = [];


                // Desbloquear
                bloqueo = false;


            } else {


                // ==========================================
                // PAREJA INCORRECTA
                // ==========================================

                intentosRestantes--;


                // Esperar un momento
                // antes de ocultar las cartas
                setTimeout(
                    () => {


                        // ==========================================
                        // SOLO OCULTAR LAS 2 CARTAS INCORRECTAS
                        // ==========================================

                        c1.querySelector("img").src =
                            dorso;

                        c1.classList.add("oculta");


                        c2.querySelector("img").src =
                            dorso;

                        c2.classList.add("oculta");


                        // Limpiar selección
                        seleccionadas = [];


                        // ==========================================
                        // SE TERMINARON LOS INTENTOS
                        // ==========================================

                        if (
                            intentosRestantes <= 0
                        ) {


                            // Bloquear el tablero
                            bloqueo = true;


                            // Mostrar todas las cartas
                            cartas.forEach(
                                c => {

                                    c.querySelector("img").src =
                                        c.dataset.valor;

                                    c.classList.remove(
                                        "oculta"
                                    );

                                }
                            );


                            // Mostrar mensaje
                            contador.textContent =
                                "❌ ¡Se terminaron tus 3 intentos!";


                            // Detener música
                            detenerMusica();


                            // Mostrar alerta
                            Swal.fire({

                                title:
                                    "😢 ¡Se terminaron los intentos!",

                                text:
                                    "Has utilizado tus 3 intentos.",

                                icon:
                                    "error",

                                confirmButtonText:
                                    "Aceptar"

                            });


                            // Mostrar botón
                            // Nueva Ronda
                            btnReiniciar.style.display =
                                "inline-block";


                            btnBarajear.style.display =
                                "inline-block";


                        } else {


                            // ==========================================
                            // TODAVÍA TIENE INTENTOS
                            // ==========================================

                            contador.textContent =
                                `❌ Pareja incorrecta. Intentos restantes: ${intentosRestantes}`;


                            // Desbloquear
                            bloqueo = false;

                        }

                    },
                    700
                );

            }

        }


        // ==========================================
        // BOTÓN BARAJEAR
        // ==========================================

        btnBarajear.addEventListener(
            "click",
            () => {


                generarCartas();


                iniciarContador();


                // Ocultar botón
                btnBarajear.style.display =
                    "none";

            }
        );


        // ==========================================
        // BOTÓN NUEVA RONDA
        // ==========================================

        btnReiniciar.addEventListener(
            "click",
            () => {


                generarCartas();


                btnBarajear.style.display =
                    "inline-block";


                btnReiniciar.style.display =
                    "none";


                contador.textContent =
                    "Presiona 'Barajear' para iniciar";

            }
        );


        // ==========================================
        // INICIAR JUEGO
        // ==========================================

        generarCartas();


        contador.textContent =
            "Presiona 'Barajear' para iniciar";

    </script>
