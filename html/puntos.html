    <script>
        function actualizarHora() {
            // Obtener la fecha y hora actual
            const ahora = new Date();

            // Formatear la hora en HH:mm:ss
            const horas = ahora.getHours().toString().padStart(2, '0');
            const minutos = ahora.getMinutes().toString().padStart(2, '0');
            const segundos = ahora.getSeconds().toString().padStart(2, '0');
            const horaFormateada = `${horas}:${minutos}:${segundos}`;

            // Asignar la hora al elemento con el id "horaActual"
            document.getElementById('horaActual').textContent = horaFormateada;
        }

        // Ejecutar la función cada segundo (1000 ms)
        setInterval(actualizarHora, 1000);
    </script>

    <script>
        let score = 0;
        let timeLeft = 180; // 3 minutos
        let gameInterval;
        let coinInterval;
        let gameActive = false;

        const gameArea = document.getElementById("game-area");
        const scoreText = document.getElementById("score");
        const timerText = document.getElementById("timer");
        const startBtn = document.getElementById("startBtn");

        function createCoin() {
            if (!gameActive) return;

            const coin = document.createElement("img");
            coin.src = "https://cdn-icons-png.flaticon.com/512/138/138292.png";
            coin.classList.add("coin");

            coin.style.left = Math.random() * 90 + "%";

            coin.onclick = () => {
                score++;
                scoreText.innerText = "Puntos: " + score;
                coin.remove();
            };

            gameArea.appendChild(coin);

            setTimeout(() => {
                coin.remove();
            }, 3000);
        }

        function startGame() {
            // Reiniciar valores
            score = 0;
            timeLeft = 180;
            gameActive = true;

            scoreText.innerText = "Puntos: 0";
            timerText.innerText = "Tiempo: 180";
            startBtn.style.display = "none";

            // Limpiar monedas anteriores
            gameArea.innerHTML = "";

            // Crear monedas
            coinInterval = setInterval(createCoin, 800);

            // Temporizador
            gameInterval = setInterval(() => {
                timeLeft--;
                timerText.innerText = "Tiempo: " + timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(gameInterval);
            clearInterval(coinInterval);

            // Eliminar monedas
            gameArea.innerHTML = "";

            Swal.fire({
                title: "⏰ Tiempo terminado",
                text: "Puntos obtenidos: " + score,
                icon: "success",
                confirmButtonText: "Jugar de nuevo"
            });

            startBtn.style.display = "inline-block";
        }

        startBtn.addEventListener("click", startGame);
    </script>
