<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gira y Gana - Fiestas Patronales</title>


    <!-- SweetAlert -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(0, 30, 70, 0.75),
                    rgba(0, 30, 70, 0.75)
                ),
                url("img/fondo-fiesta.jpg");

            background-size: cover;

            background-position: center;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;

        }


        /* CONTENEDOR PRINCIPAL */

        .contenedor-principal {

            width: 100%;

            max-width: 1100px;

            background: rgba(255,255,255,0.95);

            border-radius: 25px;

            padding: 30px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.5);

        }


        /* TITULO */

        .titulo {

            text-align: center;

            margin-bottom: 30px;

        }


        .titulo h1 {

            margin: 0;

            font-size: 42px;

            color: #123c69;

            text-transform: uppercase;

        }


        .titulo h2 {

            margin: 10px 0 0;

            color: #d89b00;

        }


        /* CONTENEDOR RULETA */

        .contenedor {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 50px;

            flex-wrap: wrap;

        }


        /* RULETA */

        .zona-ruleta {

            display: flex;

            flex-direction: column;

            align-items: center;

        }


        .ruleta-contenedor {

            position: relative;

            width: 500px;

            height: 500px;

        }


        /* IMAGEN */

        #ruleta {

            width: 100%;

            height: 100%;

            display: block;

            border-radius: 50%;

            transform-origin: center center;

            transform: rotate(0deg);

            transition:
                transform
                6s
                cubic-bezier(
                    0.15,
                    0.85,
                    0.25,
                    1
                );

            filter:
                drop-shadow(
                    0 10px 15px
                    rgba(0,0,0,0.5)
                );

        }


        /* FLECHA */

        .flecha-ruleta {

            position: absolute;

            top: -20px;

            left: 50%;

            transform:
                translateX(-50%);

            width: 0;

            height: 0;

            border-left:
                25px solid transparent;

            border-right:
                25px solid transparent;

            border-top:
                60px solid #e21d2f;

            z-index: 20;

            filter:
                drop-shadow(
                    0 3px 3px
                    rgba(0,0,0,0.6)
                );

        }


        /* CENTRO */

        .centro-ruleta {

            position: absolute;

            top: 50%;

            left: 50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            width: 75px;

            height: 75px;

            background:
                radial-gradient(
                    circle,
                    #ffffff 40%,
                    #d6a21e 42%,
                    #a87900 100%
                );

            border-radius: 50%;

            border:
                5px solid #ffffff;

            box-shadow:
                0 4px 10px
                rgba(0,0,0,0.5);

            z-index: 10;

        }


        /* SOPORTE */

        .soporte-ruleta {

            width: 260px;

            height: 70px;

            margin-top: -10px;

            background:
                linear-gradient(
                    to bottom,
                    #d5eff2,
                    #75aeb6
                );

            border-radius:
                10px
                10px
                30px
                30px;

            box-shadow:
                0 5px 10px
                rgba(0,0,0,0.4);

        }


        /* PANEL RESULTADO */

        .panel {

            width: 320px;

            min-height: 350px;

            padding: 30px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #f2f7fc
                );

            border-radius: 20px;

            box-shadow:
                0 8px 20px
                rgba(0,0,0,0.2);

            text-align: center;

        }


        .panel h2 {

            color: #123c69;

            font-size: 30px;

            margin-top: 0;

        }


        .numero {

            font-size: 70px;

            font-weight: bold;

            color: #d89b00;

            margin: 20px;

        }


        .pregunta {

            min-height: 80px;

            font-size: 18px;

            color: #333;

        }


        /* BOTON */

        #girarBtn {

            width: 100%;

            padding: 15px;

            margin-top: 20px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #123c69,
                    #1c68a8
                );

            color: white;

            font-size: 20px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }


        #girarBtn:hover {

            transform:
                scale(1.03);

            box-shadow:
                0 5px 15px
                rgba(0,0,0,0.3);

        }


        #girarBtn:disabled {

            background: #999;

            cursor: not-allowed;

            transform: none;

        }


        /* RESPONSIVE */

        @media
        (max-width: 700px) {

            .ruleta-contenedor {

                width: 90vw;

                height: 90vw;

            }


            .titulo h1 {

                font-size: 28px;

            }


            .panel {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<div class="contenedor-principal">


    <!-- TITULO -->

    <div class="titulo">

        <h1>
            🎉 Gira y Gana 🎉
        </h1>

        <h2>
            
            San Salvador
        </h2>

    </div>



    <!-- CONTENIDO -->

    <div class="contenedor">


        <!-- RULETA -->

        <div class="zona-ruleta">


            <div class="ruleta-contenedor">

    <!-- Todo lo que gira -->
    <div id="ruleta">

        <!-- Imagen de fondo -->
        <img
            src="imagenes/ruletap.jpg"
            alt="Ruleta"
        >

        <!-- Aquí aparecerán los números -->
        <div id="numerosRuleta"></div>

    </div>


    <!-- Flecha fija -->
    <div class="flecha-ruleta"></div>


    <!-- Centro fijo -->
    <div class="centro-ruleta"></div>

</div>


            <!-- SOPORTE -->

            <div
                class="soporte-ruleta">
            </div>


        </div>



        <!-- PANEL -->

        <div class="panel">


            <h2>
                Resultado
            </h2>


            <p>
                Número seleccionado:
            </p>


            <div
                id="numero"
                class="numero">

                -

            </div>


            <p
                id="pregunta"
                class="pregunta">

                Gira la ruleta
                para comenzar

            </p>


            <button
                id="girarBtn">

                🎡 GIRAR RULETA

            </button>


        </div>


    </div>


</div>



<!-- SWEET ALERT -->

<script src=
"https://cdn.jsdelivr.net/npm/sweetalert2@11">
</script>



<script>


// ============================================
// ELEMENTOS
// ============================================

const ruleta =
    document.getElementById(
        "ruleta"
    );


const girarBtn =
    document.getElementById(
        "girarBtn"
    );


const numeroDisplay =
    document.getElementById(
        "numero"
    );


const preguntaDisplay =
    document.getElementById(
        "pregunta"
    );



// ============================================
// CONFIGURACIÓN
// ============================================

const numSegmentos = 20;

let anguloActual = 0;

let animando = false;


// Preguntas utilizadas

const preguntasUsadas = [];



// ============================================
// PREGUNTAS
// ============================================

const preguntas = [

    "Pregunta 1: Mencione un área de la biblioteca",

    "Pregunta 2: ¿Cómo se llama el presidente de El Salvador?",

    "Pregunta 3: Menciona un personaje del mundo de Mario Kart",

    "Pregunta 4: ¿Cuántos colores tiene la bandera de El Salvador?",

    "Pregunta 5: ¿Cuántos niveles tiene la Biblioteca Nacional?",

    "Pregunta 6: ¿Cuál es el Pokémon más popular?",

    "Pregunta 7: Mencione un lugar turístico de El Salvador",

    "Pregunta 8: ¿Cuál es el requisito para jugar en Zona Gamer?",

    "Pregunta 9: ¿Desde qué edad se puede jugar en la Zona Gamer Nivel 6?",

    "Pregunta 10: Menciona un platillo típico de El Salvador",

    "Pregunta 11: ¿En qué nivel de la biblioteca se encuentran las áreas de Realidad Virtual, Robótica y Prototipado?",

    "Pregunta 12: ¿Qué es lo que más te gusta de la Biblioteca Nacional de El Salvador?",

    "Pregunta 13: Menciona 2 libros que hayas leído dentro de la Biblioteca",

    "Pregunta 14: ¿Cuánto tiempo puede utilizar un usuario las consolas?",

    "Pregunta 15: ¿Qué significan las iniciales BINAES?",

    "Pregunta 16: ¿Cuál es el horario de atención de la Biblioteca?",

    "Pregunta 17: ¿Se organizan torneos de videojuegos?",

    "Pregunta 18: Mencione un área de la biblioteca",

    "Pregunta 19: ¿En qué nivel de la Biblioteca se encuentra la zona de Harry Potter?",

    "Pregunta 20: ¿En qué nivel de la biblioteca se encuentra el área del Principito?"

];



// ============================================
// AUDIO
// ============================================

const audioGiro = new Audio(
    "audio/Merry-Go-Round.mp3"
);

audioGiro.loop = true;



// ============================================
// GIRAR RULETA
// ============================================

function girarRuleta() {


    // Evitar múltiples clics

    if (animando) {

        return;

    }



    // Verificar preguntas

    if (
        preguntasUsadas.length
        >=
        numSegmentos
    ) {

        Swal.fire({

            icon:
                "info",

            title:
                "¡Juego terminado!",

            text:
                "Ya se utilizaron todas las preguntas."

        });

        return;

    }



    // Activar animación

    animando = true;

    girarBtn.disabled = true;



    // Limpiar resultado

    numeroDisplay.textContent =
        "-";


    preguntaDisplay.textContent =
        "¡La ruleta está girando!";



    // ========================================
    // SELECCIONAR PREGUNTA
    // ========================================

    let indice;


    do {

        indice =
            Math.floor(
                Math.random()
                *
                numSegmentos
            );

    }

    while (
        preguntasUsadas
        .includes(indice)
    );



    // Guardar

    preguntasUsadas.push(
        indice
    );



    // ========================================
    // CALCULAR GIRO
    // ========================================

    const gradosPorSegmento =
        360
        /
        numSegmentos;


    // Variación

    const variacion =

        Math.random()
        *
        (gradosPorSegmento * 0.6)

        -

        (gradosPorSegmento * 0.3);



    // Número de vueltas

    const vueltas =

        5

        +

        Math.floor(
            Math.random() * 3
        );



    // Giro final

    const giroFinal =

        vueltas * 360

        +

        (
            360
            -
            (
                indice
                *
                gradosPorSegmento
            )
        )

        +

        variacion;



    anguloActual +=
        giroFinal;



    // ========================================
    // AUDIO
    // ========================================

    audioGiro.currentTime = 0;


    audioGiro.play()
        .catch(
            error => {

                console.log(
                    "Audio bloqueado:",
                    error
                );

            }
        );



    // ========================================
    // GIRAR IMAGEN
    // ========================================

    ruleta.style.transform =

        `rotate(${anguloActual}deg)`;



    // ========================================
    // ESPERAR FIN
    // ========================================

    setTimeout(
        function() {


            // Detener audio

            audioGiro.pause();

            audioGiro.currentTime = 0;



            // Mostrar número

            numeroDisplay.textContent =

                indice + 1;



            // Mostrar pregunta

            preguntaDisplay.textContent =

                preguntas[indice];



            // ==================================
            // MOSTRAR RESULTADO
            // ==================================

            Swal.fire({

                icon:
                    "success",

                title:
                    "🎉 ¡Resultado! 🎉",

                html:

                    `<h2>
                        Número ${indice + 1}
                    </h2>

                    <p>
                        ${preguntas[indice]}
                    </p>`,

                confirmButtonText:
                    "Continuar"

            });



            // Habilitar botón

            animando = false;

            girarBtn.disabled = false;


        },

        6000

    );

}



// ============================================
// EVENTO BOTÓN
// ============================================

girarBtn.addEventListener(

    "click",

    girarRuleta

);


</script>


</body>

</html>
